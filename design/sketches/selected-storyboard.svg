<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1188" viewBox="0 0 840 1188" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe del storyboard El corrimiento</title>
  <desc id="desc">Boceto vertical con apertura, serie temporal, distribución por edad, comparación de 24 jurisdicciones y cierre metodológico.</desc>
  <rect width="840" height="1188" fill="#f4f1ea"/>
  <g font-family="Arial, sans-serif" fill="#222222">
    <text x="64" y="62" font-size="13" letter-spacing="1.5" fill="#6f6a62">WIREFRAME · NO ES DISEÑO FINAL</text>
    <text x="64" y="104" font-size="34" font-weight="700">Menos cunas, otro país</text>
    <text x="64" y="134" font-size="16">Cayeron 46,8% y la composición se desplazó en las 24 jurisdicciones</text>

    <text x="64" y="196" font-size="32" font-weight="700">777.012</text>
    <text x="64" y="219" font-size="13" fill="#6f6a62">2014</text>
    <line x1="205" y1="190" x2="580" y2="190" stroke="#a9a39a" stroke-width="3"/>
    <path d="M568 181 L582 190 L568 199" fill="none" stroke="#a9a39a" stroke-width="3"/>
    <text x="610" y="196" font-size="32" font-weight="700" fill="#b64d32">413.135</text>
    <text x="610" y="219" font-size="13" fill="#6f6a62">2024</text>
    <text x="351" y="176" font-size="16" font-weight="700">−363.877</text>

    <line x1="64" y1="254" x2="776" y2="254" stroke="#d2ccc2"/>
    <text x="64" y="286" font-size="20" font-weight="700">No empezó con la pandemia</text>
    <rect x="64" y="306" width="712" height="138" fill="none" stroke="#c4bdb2"/>
    <polyline points="80,324 147,329 214,345 281,356 348,366 415,388 482,414 549,415 616,421 683,428 760,436" fill="none" stroke="#b64d32" stroke-width="4"/>
    <line x1="80" y1="444" x2="760" y2="444" stroke="#d2ccc2"/>
    <text x="80" y="468" font-size="12" fill="#6f6a62">2014</text>
    <text x="738" y="468" font-size="12" fill="#6f6a62">2024</text>
    <text x="380" y="342" font-size="13">La caída ya estaba en marcha antes de 2020</text>

    <line x1="64" y1="496" x2="776" y2="496" stroke="#d2ccc2"/>
    <text x="64" y="528" font-size="20" font-weight="700">El centro se movió: 20–24 → 25–29</text>
    <g font-size="11" fill="#6f6a62">
      <text x="64" y="560">&lt;15</text><text x="64" y="584">15–19</text><text x="64" y="608">20–24</text><text x="64" y="632">25–29</text>
      <text x="420" y="560">30–34</text><text x="420" y="584">35–39</text><text x="420" y="608">40–44</text><text x="420" y="632">45+</text>
    </g>
